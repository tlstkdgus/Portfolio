<!doctype html>
<!--
  그 외 프로젝트 6개(손글·웰컴키트·사내 개발 교육·dotori·NeuroSight·TCP) 썸네일 원본 (2026-09-25).
  thumbs.html과 같은 틀(1600×1000, 로고 + 한 줄 + 역할 + 실제 화면). ?lang=ko | ?lang=en 으로 언어를 고른다.
  - 로고: 손글·dotori·NeuroSight는 발표 자료 표지에서 추출(assets/sg_logo·dotori_logo·ns_logo), 웰컴키트는 저장소 Logo.png,
    사내 교육은 교육 사이트 파비콘. TCP는 로고가 없어 글자로 둔다.
  - 화면: 웰컴키트는 저장소를 로컬에서 띄워 캡처(API는 가짜 응답, 빙고 칸 글자는 '미션 N'), 사내 교육은 배포 사이트 캡처,
    나머지는 public/projects의 발표 자료 슬라이드.
  - 팀원 이름은 넣지 않는다.
-->
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root { --ink:#0a0a0a; --muted:#f3f3f1; --blue:#1f36ff; --line:rgba(10,10,10,.18); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Pretendard Variable",Pretendard,sans-serif; background:#777; }
  .t { position:relative; width:1600px; height:1000px; overflow:hidden; margin-bottom:40px; color:var(--ink); background:var(--muted); }
  .t.ink { background:var(--ink); color:#fafafa; --line:rgba(250,250,250,.22); }
  .t.blue { background:var(--blue); color:#fff; --line:rgba(255,255,255,.35); }
  .meta { position:absolute; left:80px; right:80px; top:64px; display:flex; justify-content:space-between; font-size:30px; font-weight:700; letter-spacing:.06em; padding-bottom:24px; border-bottom:2px solid var(--line); }
  .copy { position:absolute; left:80px; bottom:76px; width:620px; z-index:5; }
  .brand { display:flex; align-items:center; gap:26px; font-size:118px; font-weight:800; letter-spacing:-.05em; line-height:1; }
  .sub { margin-top:34px; font-size:40px; font-weight:600; line-height:1.35; letter-spacing:-.02em; opacity:.82; white-space:pre-line; }
  .role { margin-top:40px; font-size:28px; font-weight:700; letter-spacing:.12em; }
  .role::before { content:""; display:inline-block; width:18px; height:18px; background:var(--blue); margin-right:16px; }
  .blue .role::before { background:#fff; }
  html[lang=ko] .meta { letter-spacing:.01em; } html[lang=ko] .role { letter-spacing:.02em; } html[lang=ko] .sub { letter-spacing:-.03em; }
  .dev { position:absolute; }
  .shadow { box-shadow:0 40px 80px -20px rgba(0,0,0,.35), 0 12px 24px -8px rgba(0,0,0,.18); }
  .laptop .scr { border:16px solid #1c1c1e; border-bottom-width:22px; border-radius:22px 22px 6px 6px; overflow:hidden; background:#000; }
  .laptop .scr img { display:block; width:100%; }
  .laptop .base { height:22px; margin:0 -9%; background:linear-gradient(#d9d9dc,#a9a9ae); border-radius:2px 2px 14px 14px; }
  .phone { border:12px solid #111; border-radius:52px; overflow:hidden; background:#fff; }
  .phone img { display:block; width:100%; height:100%; object-fit:cover; object-position:top; }
  .window { border-radius:14px; overflow:hidden; background:#fff; }
  .window .bar { height:34px; background:#ececea; display:flex; align-items:center; gap:9px; padding-left:16px; }
  .window .bar i { width:12px; height:12px; border-radius:50%; background:#c9c9c6; display:block; }
  .window img { display:block; width:100%; }
</style>
</head>
